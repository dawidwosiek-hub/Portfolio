name: nm
on: push
jobs:
  nm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm ci && npx playwright install chromium && tar czf nm.tgz node_modules -C ~/.cache ms-playwright
      - uses: actions/upload-artifact@v4
        with: {name: nm, path: nm.tgz, retention-days: 1}
